<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Newsletter | Individual Motion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; margin: 0; overflow: hidden; }
        .serif-font { font-family: 'Playfair Display', serif; }
        .elegant-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 30px 60px rgba(197, 160, 89, 0.08);
        }
        .gold-soft-gradient {
            background: linear-gradient(to right, #c5a059, #e9d1a1, #c5a059);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
    {% raw %}
        const { useState, useEffect, useRef } = React;

        function NewsletterSignup() {
          const [email, setEmail] = useState('');
          const [isSubmitted, setIsSubmitted] = useState(false);
          const [isLoading, setIsLoading] = useState(false);
          const mountRef = useRef(null);
          const objectsRef = useRef([]);
          const mouseRef = useRef({ x: 0, y: 0 });

          useEffect(() => {
            if (!mountRef.current || typeof THREE === 'undefined') return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            mountRef.current.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xe9d1a1, 1.2);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            const geometries = [
                new THREE.TorusGeometry(1, 0.4, 16, 100),
                new THREE.OctahedronGeometry(1.5),
                new THREE.TetrahedronGeometry(1.5),
                new THREE.IcosahedronGeometry(1.5),
                new THREE.BoxGeometry(2, 2, 2),
                new THREE.SphereGeometry(1.2, 32, 32),
                new THREE.ConeGeometry(1, 2, 32),
                new THREE.TorusKnotGeometry(1, 0.3, 100, 16),
            ];

            for (let i = 0; i < 25; i++) {
                const geometry = geometries[Math.floor(Math.random() * geometries.length)];
                const material = new THREE.MeshPhongMaterial({ 
                    color: 0xc5a059, 
                    shininess: 40,
                    transparent: true,
                    opacity: 0.35
                });
                const mesh = new THREE.Mesh(geometry, material);

                mesh.position.set((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50);

                // ADDING INDIVIDUAL OFFSETS so they don't clump together
                mesh.userData = {
                  velocity: {
                    x: (Math.random() - 0.5) * 0.01,
                    y: (Math.random() - 0.5) * 0.01,
                    z: (Math.random() - 0.5) * 0.01,
                  },
                  rotationSpeed: {
                    x: (Math.random() - 0.5) * 0.005,
                    y: (Math.random() - 0.5) * 0.005,
                    z: (Math.random() - 0.5) * 0.005,
                  },
                  mouseOffset: {
                    x: (Math.random() - 0.5) * 15, // Each object wants to be in a different spot
                    y: (Math.random() - 0.5) * 15
                  }
                };

                scene.add(mesh);
                objectsRef.current.push(mesh);
            }

            const handleMouseMove = (e) => {
                mouseRef.current.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouseRef.current.y = -(e.clientY / window.innerHeight) * 2 + 1;
            };
            window.addEventListener('mousemove', handleMouseMove);

            const animate = () => {
              requestAnimationFrame(animate);
              objectsRef.current.forEach((mesh) => {
                // Individual rotation & drift
                mesh.rotation.x += mesh.userData.rotationSpeed.x;
                mesh.rotation.y += mesh.userData.rotationSpeed.y;
                mesh.position.x += mesh.userData.velocity.x;
                mesh.position.y += mesh.userData.velocity.y;

                // Screen bounds
                if (Math.abs(mesh.position.x) > 30) mesh.userData.velocity.x *= -1;
                if (Math.abs(mesh.position.y) > 30) mesh.userData.velocity.y *= -1;

                // INDIVIDUALIZED MOUSE INTERACTION (Non-clumping)
                const targetX = (mouseRef.current.x * 10) + mesh.userData.mouseOffset.x;
                const targetY = (mouseRef.current.y * 10) + mesh.userData.mouseOffset.y;
                
                mesh.position.x += (targetX - mesh.position.x) * 0.005;
                mesh.position.y += (targetY - mesh.position.y) * 0.005;
              });
              renderer.render(scene, camera);
            };
            animate();

            return () => {
              window.removeEventListener('mousemove', handleMouseMove);
              if (mountRef.current) mountRef.current.removeChild(renderer.domElement);
            };
          }, []);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setIsLoading(true);
            objectsRef.current.forEach((mesh) => {
              const direction = mesh.position.clone().normalize();
              mesh.userData.velocity.x += direction.x * 0.7;
              mesh.userData.velocity.y += direction.y * 0.7;
            });
            setTimeout(() => { setIsLoading(false); setIsSubmitted(true); }, 1500);
          };

          return (
            <div className="relative min-h-screen flex items-center justify-center p-6">
              <div ref={mountRef} className="fixed inset-0 w-full h-full -z-10" />
              <div className="elegant-glass p-14 rounded-[3.5rem] max-w-md w-full text-center">
                {!isSubmitted ? (
                  <>
                    <h2 className="text-[9px] uppercase tracking-[0.7em] text-gray-400 font-bold mb-3">NEWSLETTER</h2>
                    <h1 className="serif-font text-5xl text-gray-800 italic leading-tight mb-10">
                        The <span className="gold-soft-gradient">Aesthetic</span> Edit
                    </h1>
                    <form onSubmit={handleSubmit} className="space-y-6">
                      <input
                        type="email"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="Email Address"
                        required
                        className="w-full px-8 py-5 bg-white/50 border border-gray-100 rounded-full focus:outline-none focus:border-yellow-600/20 text-gray-600 placeholder-gray-300 font-light text-center"
                      />
                      <button type="submit" disabled={isLoading} className="w-full bg-[#c5a059] text-white font-semibold py-5 rounded-full shadow-lg hover:bg-[#b08d4a] transition-all duration-1000 uppercase tracking-[0.3em] text-[10px]">
                        {isLoading ? 'Sending...' : 'Join Now'}
                      </button>
                    </form>
                  </>
                ) : (
                  <div className="py-10 animate-fade-in">
                    <div className="text-[#c5a059] text-5xl mb-6">✧</div>
                    <h2 className="serif-font text-3xl text-gray-800 italic mb-2">Welcome</h2>
                    <p className="text-gray-400 font-light text-sm italic">{email}</p>
                    <button onClick={() => setIsSubmitted(false)} className="mt-12 text-[10px] uppercase tracking-widest text-gray-300 hover:text-gray-500 transition-colors">Return</button>
                  </div>
                )}
              </div>
            </div>
          );
        }
        ReactDOM.render(<NewsletterSignup />, document.getElementById('root'));
    {% endraw %}
    </script>
</body>
</html>
